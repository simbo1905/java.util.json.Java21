name: Java CI with Maven

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    branches: [ "main" ]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-java21:
    name: Test Core Library (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'oracle'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-java21-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-java21
    
    - name: Test core library (Java 21)
      run: mvn clean test -pl json-java21

  test-java25:
    name: Test with Tooling (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-java25-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-java25
    
    - name: Test full project (Java 25)
      run: mvn clean test

  docker-build:
    name: Build Docker image (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-java25
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: 'maven'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: jtd2jar/Dockerfile
        push: false
        load: true
        tags: jtd2jar:ci
    
    - name: Smoke test
      run: |
        docker run --rm jtd2jar:ci --help
